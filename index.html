<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دفتر الصيدلية والعيادة البيطرية</title>
<meta name="theme-color" content="#183f2c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap">
<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/supabase.min.js"></script>
<script src="config.js"></script>
<style>
/* Layout: an accounting ledger book — bottle-green cover band with index tabs, ruled paper sheets below,
   numbers in ruled columns, totals under a double rule, red ink for money going out. */
:root{
  --paper:#eef2e7; --sheet:#fafcf6; --rule:#c8d6bd; --rule-soft:#e1e9d9; --margin:#d9a49c;
  --ink:#17231b; --ink-2:#46564b; --ink-3:#7b897e;
  --cover:#183f2c; --cover-2:#0f2c1e; --cover-ink:#eef3e6; --cover-dim:#a9c2ae; --brass:#d8b46a;
  --in:#1f4f99; --out:#b1342a; --gold:#9a6a12; --gold-soft:#f4e7c8; --okbg:#dcebd9;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --ruqaa:"Aref Ruqaa","Readex Pro",serif;
  --body:"Readex Pro",system-ui,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#101813; --sheet:#152019; --rule:#2c3d32; --rule-soft:#1f2c24; --margin:#5d3430;
  --ink:#e3ebdf; --ink-2:#a9b8ab; --ink-3:#7c8b7f;
  --cover:#0b1f15; --cover-2:#07150e; --cover-ink:#e7eee2; --cover-dim:#8fa995; --brass:#d8b46a;
  --in:#7fa8ec; --out:#f08a7e; --gold:#e0b25a; --gold-soft:#3a2d12; --okbg:#1d3326;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#101813; --sheet:#152019; --rule:#2c3d32; --rule-soft:#1f2c24; --margin:#5d3430;
  --ink:#e3ebdf; --ink-2:#a9b8ab; --ink-3:#7c8b7f;
  --cover:#0b1f15; --cover-2:#07150e; --cover-ink:#e7eee2; --cover-dim:#8fa995; --brass:#d8b46a;
  --in:#7fa8ec; --out:#f08a7e; --gold:#e0b25a; --gold-soft:#3a2d12; --okbg:#1d3326;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; color-scheme:dark}

*{box-sizing:border-box}
:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
.login{max-width:420px;margin:40px auto;display:grid;gap:12px}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;direction:rtl;font-weight:400}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--cover)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.n,td.n,th.n{font-variant-numeric:tabular-nums lining-nums;direction:ltr;unicode-bidi:isolate}
a{color:var(--in)}

/* cover band */
header.cover{background:linear-gradient(180deg,var(--cover),var(--cover-2));color:var(--cover-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.cover .row{display:flex;align-items:center;gap:16px 28px;flex-wrap:wrap;padding-block:12px 6px}
.title{font-family:var(--ruqaa);font-size:30px;font-weight:700;line-height:1.1;margin:0;letter-spacing:0}
.title small{display:block;font-family:var(--body);font-size:11.5px;font-weight:400;color:var(--cover-dim);letter-spacing:.04em;margin-top:4px}
.stamp{margin-inline-start:auto;display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap}
.stamp .k{font-size:11.5px;color:var(--cover-dim)}
.stamp .v{font-size:24px;font-weight:600;line-height:1.15}
.stamp .box{border:1.5px solid var(--brass);border-radius:4px;padding:4px 12px 5px;color:var(--brass)}
.stamp .box .k{color:var(--brass);opacity:.85}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:6px}
.tabs a{color:var(--cover-dim);text-decoration:none;padding:7px 16px 8px;border-radius:7px 7px 0 0;white-space:nowrap;font-size:14.5px;font-weight:500}
.tabs a:hover{color:var(--cover-ink)}
.tabs a[aria-current="page"]{background:var(--paper);color:var(--ink)}

main{padding-block:22px 110px;display:grid;gap:26px}
.sec-h{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.sec-h h2{font-family:var(--ruqaa);font-weight:700;font-size:26px;margin:0;line-height:1.2}
.sec-h .line{flex:1;min-width:40px;border-bottom:1px solid var(--rule);transform:translateY(-6px)}
.sec-h .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
h3{font-size:15px;font-weight:600;margin:0}
.hint{color:var(--ink-3);font-size:12.5px}

/* ruled sheet */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:3px;position:relative;min-width:0;
  box-shadow:0 1px 0 var(--rule-soft),0 3px 0 -1px var(--sheet),0 3px 0 0 var(--rule-soft)}
.sheet.pad{padding:16px 18px 18px}
.sheet .sh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sheet .sh h3{font-family:var(--ruqaa);font-size:21px;font-weight:700}
.sheet .sh .hint{margin-inline-start:auto}
.ruled{background-image:repeating-linear-gradient(180deg,transparent 0 31px,var(--rule-soft) 31px 32px)}

/* ledger strip (KPIs) */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--sheet);border:1px solid var(--rule);border-radius:3px}
.strip>div{padding:12px 16px 14px;border-inline-start:1px solid var(--rule);display:grid;gap:1px;align-content:start}
.strip>div:first-child{border-inline-start:none}
.strip .k{font-size:12.5px;color:var(--ink-2)}
.strip .v{font-size:26px;font-weight:600;line-height:1.2}
.strip .d{font-size:12px;color:var(--ink-3)}
.strip .hero{background:var(--cover);color:var(--cover-ink)}
.strip .hero .k,.strip .hero .d{color:var(--cover-dim)}
.up{color:#1c7a3e} .down{color:var(--out)}
.strip .hero .up{color:#8fdcaa} .strip .hero .down{color:#ffb0a6}
.in{color:var(--in)} .out{color:var(--out)} .gold{color:var(--gold)}

.cols{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
@media (max-width:900px){.c8,.c7,.c6,.c5,.c4{grid-column:span 12}}

/* controls */
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:4px;padding:7px 14px;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--cover);border-color:var(--cover);color:var(--cover-ink)}
.btn.danger{color:var(--out);border-color:var(--out)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:none;padding:5px 11px;font-size:13px}
.seg button+button{border-inline-start:1px solid var(--rule)}
input[type=date],input[type=month],input[type=text],input[type=number],input[type=search],select{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:7px 10px;min-width:0}
input[type=number]{direction:ltr;text-align:right}

/* tables: ledger columns */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--rule-soft)}
th{font-weight:500;font-size:12px;color:var(--ink-2);border-bottom:1.5px solid var(--ink-3);vertical-align:bottom}
td.n,th.n{text-align:left}
td.n+td.n,th.n+th.n{border-inline-start:1px solid var(--rule-soft)}
td.desc{white-space:normal;min-width:120px}
td.z{color:var(--rule)}
tfoot td{font-weight:600;border-top:3px double var(--ink);border-bottom:none}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--rule-soft)}
.margin-l{border-inline-start:2px solid var(--margin)}
.tag{display:inline-block;padding:0 7px;border-radius:3px;font-size:12px;border:1px solid currentColor}
.tag.debt{color:var(--gold);background:var(--gold-soft);border-color:transparent}

/* charts */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin:-2px 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:5px;vertical-align:-1px}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible;direction:ltr}
.chart text{fill:var(--ink-3);font-size:11px;font-family:var(--body)}
.chart .grid{stroke:var(--rule-soft)}
.chart .base{stroke:var(--ink-3)}
.chart .ref{stroke:var(--ink-2);stroke-dasharray:4 4}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);padding:7px 10px;border-radius:4px;font-size:12.5px;line-height:1.55;white-space:nowrap;z-index:3;top:0}
.tip b{font-weight:600}
.hb{display:grid;gap:7px}
.hb .r{display:grid;grid-template-columns:minmax(70px,130px) 1fr minmax(64px,auto);gap:10px;align-items:center;font-size:13px}
.hb .r>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .t{height:12px;background:var(--rule-soft);border-radius:2px;overflow:hidden}
.hb .t i{display:block;height:100%;border-radius:0 3px 3px 0}
.hb .r .n{text-align:left;color:var(--ink-2)}

.note{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:11px 16px;border:1px dashed var(--gold);background:var(--gold-soft);border-radius:3px;font-size:14px}
.note.ok{border-color:var(--rule);background:var(--okbg)}
.empty{padding:26px 16px;text-align:center;color:var(--ink-3)}
.daysum{display:flex;flex-wrap:wrap;border:1px solid var(--rule);background:var(--sheet);border-radius:3px}
.daysum span{padding:7px 14px;border-inline-start:1px solid var(--rule-soft);font-size:13px;color:var(--ink-2)}
.daysum span:first-child{border-inline-start:none}
.daysum b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;margin-inline-start:4px}

/* entry sheet */
.ov{position:fixed;inset:0;background:rgba(6,18,11,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.form{background:var(--sheet);width:min(780px,100%);max-height:92vh;overflow:auto;border-top:5px solid var(--cover);border-radius:6px 6px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
@media (min-width:820px){.ov{align-items:center}.form{border-radius:6px}}
.form h2{font-family:var(--ruqaa);font-size:26px;margin:0}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
.f{display:grid;gap:2px;min-width:0}
.f label{font-size:12.5px;color:var(--ink-2)}
fieldset{border:1px solid var(--rule);border-radius:3px;padding:8px 12px 12px;margin:0;min-width:0}
legend{font-family:var(--ruqaa);font-size:17px;font-weight:700;padding:0 6px;color:var(--cover)}
:root[data-theme="dark"] legend{color:var(--brass)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) legend{color:var(--brass)}}
details summary{cursor:pointer;color:var(--in);padding:2px 0}
.err{color:var(--out);font-size:13px}
.confirm{border:1px solid var(--out);border-radius:3px;padding:10px 12px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:4px;z-index:30;font-size:14px}
.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:calc(18px + env(safe-area-inset-left,0px));z-index:6;border-radius:4px;padding:12px 20px;font-size:16px;font-weight:600;
  background:var(--cover);color:var(--cover-ink);border:1.5px solid var(--brass);box-shadow:0 4px 0 var(--cover-2)}
.fab:active{transform:translateY(2px);box-shadow:0 2px 0 var(--cover-2)}
@media (max-width:560px){.title{font-size:25px}.stamp .v{font-size:19px}.strip .v{font-size:21px}.sec-h h2{font-size:22px}}
@media (prefers-reduced-motion:no-preference){.form{animation:up .18s ease-out}@keyframes up{from{transform:translateY(20px);opacity:.6}}}
</style>
</head><body>
<header class="cover">
  <div class="wrap row">
    <h1 class="title"><span id="clinicName">دفتر الصيدلية والعيادة البيطرية</span><small id="todayLbl"></small></h1>
    <div class="stamp">
      <div><div class="k">حركة النهارده</div><div class="v n" id="hdrToday">—</div></div>
      <div class="box"><div class="k">رصيد الخزنة</div><div class="v n" id="hdrBal">—</div><div class="k n" id="hdrSplit" style="direction:rtl"></div></div>
    </div>
  </div>
  <div class="wrap"><nav class="tabs" id="tabs">
    <a href="#home">الداشبورد</a><a href="#day">اليومية</a><a href="#items">الأصناف</a><a href="#month">تقرير الشهر</a><a href="#year">السنة</a><a href="#debts">الديون</a><a href="#search">بحث</a><a href="#setup">الإعدادات والنسخ</a>
  </nav></div>
</header>

<main class="wrap" id="main"><div class="sheet empty">بيفتح الدفتر…</div></main>

<button class="fab" id="fab" type="button">+ تسجيل حركة</button>
<div id="ovHost"></div>
<div class="toast" id="toast" hidden></div>
<datalist id="dlDesc"></datalist><datalist id="dlItems"></datalist><datalist id="dlParty"></datalist>

<script>
/* months/<YYYY-MM> {m, days:{YYYY-MM-DD:[entry]}} · config/main {name, openDate, openAmount, lastBackup}
   entry: d بيان, p الاونر, mi/mo/mp أدوية, fi/fo/fp علف ومستلزمات, ii/io/ip لقاحات, xi/xo/xp إضافي, so سونار, ex مصاريف, ch صدقة,
          db باقي, pd تحصيل, wo شطب, vi/vo/ve فودافون, i id */
const GROUPS=[{name:'أدوية',f:['mi','mo','mp']},{name:'علف ومستلزمات',f:['fi','fo','fp']},{name:'لقاحات',f:['ii','io','ip']},{name:'إضافي',f:['xi','xo','xp']}];
const LABEL={mi:'داخل',mo:'خارج',mp:'مكسب',fi:'داخل',fo:'خارج',fp:'مكسب',ii:'داخل',io:'خارج',ip:'مكسب',xi:'داخل',xo:'خارج',xp:'مكسب',
  so:'سونار',ks:'كشف وعلاج',sg:'عمليات',ex:'مصاريف',ch:'صدقة',db:'باقي',pd:'تحصيل',wo:'شطب',vi:'فودافون داخل',vo:'فودافون خارج',ve:'فودافون مصاريف',sd:'دين موردين'};
const NUMF=['mi','mo','mp','fi','fo','fp','ii','io','ip','xi','xo','xp','so','ks','sg','ks','sg','ex','ch','db','pd','wo','vi','vo','ve','sd'];
const SRC=[{k:'mp',name:'أدوية',c:'--s1'},{k:'svc',name:'خدمات العيادة',c:'--s2'},{k:'fp',name:'علف ومستلزمات',c:'--s3'},{k:'ip',name:'لقاحات',c:'--s4'},{k:'xp',name:'إضافي',c:'--s5'}];
const g=(e,k)=>+e[k]||0;
const cashIn=e=>g(e,'mi')+g(e,'fi')+g(e,'ii')+g(e,'xi')+g(e,'so')+g(e,'ks')+g(e,'sg')+g(e,'pd');
const cashOut=e=>g(e,'mo')+g(e,'fo')+g(e,'io')+g(e,'xo')+g(e,'ex')+g(e,'ch');
const vfNet=e=>g(e,'vi')-g(e,'vo')-g(e,'ve');
/* من شيت 5.26 الإكسل مفيهوش عمود مكسب للعلف واللقاحات: المكسب = داخل − خارج (زي معادلة الإكسل) */
const DERIVE_FROM='2026-01-01';
const fpOf=(e,d)=>(('fp' in e)||!d||d<DERIVE_FROM)?g(e,'fp'):g(e,'fi')-g(e,'fo');
const ipOf=(e,d)=>(('ip' in e)||!d||d<DERIVE_FROM)?g(e,'ip'):g(e,'ii')-g(e,'io');
const profit=(e,d)=>g(e,'mp')+fpOf(e,d)+ipOf(e,d)+g(e,'xp')+g(e,'so')+g(e,'ks')+g(e,'sg');
const netOf=(e,d)=>profit(e,d)-g(e,'ex')-g(e,'ch')-g(e,'ve');

const S={months:{},config:{name:'دفتر الصيدلية والعيادة البيطرية',openDate:'2026-11-01',openAmount:0},db:null,dl:null,ready:false,day:null,month:null,dash:null,year:null,debtAll:false,q:'',cache:null,items:{},iq:'',fl:'all'};
const $=s=>document.querySelector(s);
const fmt=n=>{n=Math.round((+n||0)*100)/100;return n.toLocaleString('en-US',{maximumFractionDigits:2})};
const kfmt=n=>Math.abs(n)>=1000?(Math.round(n/100)/10).toLocaleString('en-US')+'k':fmt(n);
const pct=(a,b)=>b?((a-b)/Math.abs(b)*100):null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const curMonth=()=>todayISO().slice(0,7);
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const dayName=iso=>DAYS[new Date(iso+'T12:00:00').getDay()];
const monthName=m=>MONTHS[+m.slice(5,7)-1]+' '+m.slice(0,4);
const shortM=m=>MONTHS[+m.slice(5,7)-1].slice(0,3)+' '+m.slice(2,4);
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const addMonths=(m,n)=>{let y=+m.slice(0,4),mm=+m.slice(5,7)+n;while(mm>12){mm-=12;y++}while(mm<1){mm+=12;y--}return y+'-'+String(mm).padStart(2,'0')};
const dim=m=>new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
const uid=()=>Math.random().toString(36).slice(2,9);
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2800)}

/* ===== derived (cached per snapshot) ===== */
function idx(){
  if(S.cache)return S.cache;
  const days=[];for(const m of Object.values(S.months))for(const [d,es] of Object.entries(m.days||{}))if(es&&es.length)days.push([d,es]);
  days.sort((a,b)=>a[0]<b[0]?-1:1);
  const daySum={},monSum={};
  for(const [d,es] of days){const s=sumEntries(es,d);daySum[d]=s;const m=d.slice(0,7);const ms=monSum[m]||(monSum[m]=zero());add(ms,s);ms.days++}
  // running balance from opening date
  const bal={};let b=+S.config.openAmount||0,vf=+S.config.openWallet||0;b+=vf;for(const [d] of days){if(d<S.config.openDate)continue;const s=daySum[d];b+=s.cashIn-s.cashOut+s.vf;vf+=s.vf;bal[d]=b}
  return S.cache={days,daySum,monSum,bal,end:b,endVf:vf,endCash:b-vf};
}
function zero(){const s={svc:0,cashIn:0,cashOut:0,vf:0,profit:0,net:0,n:0,days:0};for(const k of NUMF)s[k]=0;return s}
function add(a,b){for(const k in b)if(k!=='days')a[k]+=b[k]}
function sumEntries(es,d){const s=zero();for(const e of es){const dd=d||e._d||'';for(const k of NUMF)s[k]+=g(e,k);s.fp+=fpOf(e,dd)-g(e,'fp');s.ip+=ipOf(e,dd)-g(e,'ip');s.svc+=g(e,'so')+g(e,'ks')+g(e,'sg');s.cashIn+=cashIn(e);s.cashOut+=cashOut(e);s.vf+=vfNet(e);s.profit+=profit(e,dd);s.net+=netOf(e,dd);s.n++}return s}
const mSum=m=>idx().monSum[m]||zero();
function dayEntries(iso){const m=S.months[iso.slice(0,7)];return (m&&m.days&&m.days[iso])||[]}
function monthEntries(m){const mo=S.months[m];if(!mo)return [];return Object.keys(mo.days||{}).sort().flatMap(d=>(mo.days[d]||[]).map((e,ix)=>({...e,_d:d,_ix:ix})))}
function balAt(iso){const I=idx();if(iso<S.config.openDate)return null;let b=+S.config.openAmount||0;for(const [d] of I.days){if(d>iso)break;if(d>=S.config.openDate)b=I.bal[d]}return b}

  sb=window.supabase.createClient(C.url,C.anonKey,{auth:{persistSession:true,autoRefreshToken:true}});

async function startData(){
  $('#fab').hidden=false;$('#tabs').hidden=false;$('#main').innerHTML='<div class="sheet empty">بيفتح الدفتر…</div>';
  let data=[],error=null;for(let from=0;;from+=1000){const r=await sb.from('docs').select('path,data').order('path').range(from,from+999);if(r.error){error=r.error;break}data=data.concat(r.data);if(r.data.length<1000)break}
  if(error){$('#main').innerHTML='<div class="sheet pad err">مقدرتش أقرا البيانات: '+esc(error.message)+'</div>';return}
  S.months={};S.items={};setMonthsFromRows(data||[]);S.ready=true;lists();render();
  if(chan)sb.removeChannel(chan);
  chan=sb.channel('docs-live').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
    if(p.eventType==='DELETE'){const path=p.old&&p.old.path;if(path&&path.startsWith('months/'))delete S.months[path.slice(7)];if(path&&path.startsWith('items/'))delete S.items[path.slice(6)]}
    else if(p.new)setMonthsFromRows([p.new]);
    S.cache=null;if(!S.busy&&!document.querySelector('.ov'))render()}).subscribe();
}
async function writeDay(iso,fn){

  const cur=(data&&data.data&&data.data.days&&data.data.days[iso])||[];const next=fn(cur.map(e=>({...e})));

  const mo=S.months[m]||(S.months[m]={m,days:{}});mo.days={...(mo.days||{}),[iso]:next};S.cache=null;lists();
}

/* ===== charts (SVG, one axis, RTL time: oldest on the right) ===== */
function nice(v){if(v<=0)return 1;const p=10**Math.floor(Math.log10(v));const n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function ticks(mn,mx){const st=nice((mx-mn)/4);const o=[];for(let t=Math.ceil(mn/st)*st;t<=mx+1e-9;t+=st)o.push(+t.toFixed(6));return o}
const cw=h=>Math.max(280,Math.round(h.clientWidth||640));
const every=(n,W,px=46)=>Math.max(1,Math.ceil(n*px/Math.max(1,W-48)));
function frame(host){host.innerHTML='<div class="tip" hidden></div>';return host.firstChild}
function hover(host,tip,W,cells,html){
  const svg=host.querySelector('svg');
  const show=i=>{tip.innerHTML=html(i);tip.hidden=false;const sc=svg.getBoundingClientRect().width/W;const c=cells[i];let x=(c.x+c.w/2)*sc-tip.offsetWidth/2;x=Math.max(0,Math.min(x,host.clientWidth-tip.offsetWidth));tip.style.left=x+'px';tip.style.top=(-tip.offsetHeight-4)+'px';
    host.querySelectorAll('[data-hl]').forEach(el=>el.setAttribute('opacity',+el.dataset.hl===i?1:.55))};
  const hide=()=>{tip.hidden=true;host.querySelectorAll('[data-hl]').forEach(el=>el.setAttribute('opacity',1))};
  host.querySelectorAll('rect[data-i]').forEach(r=>{const i=+r.dataset.i;r.addEventListener('mouseenter',()=>show(i));r.addEventListener('click',()=>show(i))});
  svg.addEventListener('mouseleave',hide);
}
function axes(W,H,pl,pr,pt,pb,mn,mx,y,suffix=''){let s='';for(const t of ticks(mn,mx))s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${W-pr+6}" y="${y(t)+4}">${kfmt(t)}${suffix}</text>`;return s}
const topPath=(x,y,w,h,r)=>{r=Math.min(r,h,w/2);return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`};
const botPath=(x,y0,w,y1,r)=>{const h=y1-y0;r=Math.min(r,h,w/2);return `M${x},${y0}V${y1-r}Q${x},${y1} ${x+r},${y1}H${x+w-r}Q${x+w},${y1} ${x+w},${y1-r}V${y0}Z`};
function stacked(host,data){
  const W=cw(host),H=260,pl=4,pr=44,pt=12,pb=24,tip=frame(host);const ev=every(data.length,W);
  const pos=d=>d.parts.reduce((a,p)=>a+Math.max(0,p.v),0),neg=d=>d.parts.reduce((a,p)=>a+Math.min(0,p.v),0);
  const mx=nice(Math.max(1,...data.map(pos)));let mn=Math.min(0,...data.map(neg));mn=mn<0?-nice(-mn):0;
  const y=v=>pt+(H-pt-pb)*(mx-v)/(mx-mn);const bw=(W-pl-pr)/data.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="المكسب حسب المصدر">`+axes(W,H,pl,pr,pt,pb,mn,mx,y);const cells=[];

function bars(host,data,color,o={}){

function line(host,data,color,o={}){

  const vals=data.map(d=>d.v).filter(v=>v!=null);if(!vals.length){host.innerHTML='<div class="empty">مفيش بيانات كفاية</div>';return}

  const y=v=>pt+(H-pt-pb)*(mx-v)/(mx-mn);const n=data.length,step=(W-pl-pr)/Math.max(1,n);const X=i=>W-pr-(i+.5)*step;

  let d='',a='',started=false,lastI=-1,firstI=-1;data.forEach((p,i)=>{if(p.v==null){started=false;return}d+=(started?'L':'M')+X(i).toFixed(1)+','+y(p.v).toFixed(1);if(firstI<0)firstI=i;lastI=i;started=true});

  s+=`<line class="ref" id="xh" x1="0" x2="0" y1="${pt}" y2="${H-pb}" visibility="hidden"/><circle id="xd" r="4" fill="var(${color})" stroke="var(--sheet)" stroke-width="2" visibility="hidden"/>`;
  const cells=data.map((p,i)=>({x:X(i)-step/2,w:step}));cells.forEach((c,i)=>s+=`<rect data-i="${i}" x="${c.x}" y="0" width="${c.w}" height="${H}" fill="transparent"/>`);
  s+=`<line class="base" x1="${pl}" x2="${W-pr}" y1="${y(mn)}" y2="${y(mn)}"/></svg>`;host.insertAdjacentHTML('beforeend',s);

  host.querySelector('svg').addEventListener('mouseleave',()=>{xh.setAttribute('visibility','hidden');xd.setAttribute('visibility','hidden')});
}

function grouped(host,data,la,lb,ca='--s1',cb='--s2'){

    s+=`${(data.length-1-i)%ev?'':`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${d.label}</text>`}<rect data-i="${i}" x="${x}" y="0" width="${bw}" height="${H}" fill="transparent"/>`;cells.push({x,w:bw})});
  s+=`<line class="base" x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}"/></svg>`;host.insertAdjacentHTML('beforeend',s);

/* ===== DEBTS ===== */
function debtRows(all){const from=all?'0000':S.config.openDate;const map={};
  for(const [d,es] of idx().days){if(d<from)continue;for(const e of es){const db=g(e,'db'),pd=g(e,'pd'),wo=g(e,'wo');if(!db&&!pd&&!wo)continue;const k=partyKey(e);const r=map[k]||(map[k]={name:k,debt:0,paid:0,wo:0,last:d,moves:[]});r.debt+=db;r.paid+=pd;r.wo+=wo;r.last=d;r.moves.push({d,db,pd,wo})}}
  return Object.values(map).map(r=>({...r,rem:r.debt-r.paid-r.wo})).sort((a,b)=>b.rem-a.rem)}
function vDebts(){
  const rows=debtRows(S.debtAll),open=rows.filter(r=>Math.round(r.rem)>0),closed=rows.filter(r=>Math.round(r.rem)<=0),tot=open.reduce((a,r)=>a+r.rem,0);
  $('#main').innerHTML=`
  <div class="sec-h"><h2>الديون</h2><span class="line"></span><div class="tools"><label class="hint"><input type="checkbox" id="dAll" ${S.debtAll?'checked':''}> اعرض ديون الإكسل القديمة</label></div></div>
  <div class="strip"><div class="hero"><span class="k">إجمالي الديون المفتوحة</span><span class="v n">${fmt(tot)}</span><span class="d">${open.length} اسم · ${S.debtAll?'كل الفترة':'من '+S.config.openDate}</span></div></div>
  ${open.length?`<section class="sheet"><div class="tbl"><table><thead><tr><th>الاسم</th><th class="n">عليه</th><th class="n">دفع</th><th class="n">شطب</th><th class="n">الباقي</th><th>آخر حركة</th><th></th></tr></thead><tbody>
  ${open.map((r,i)=>`<tr><td class="desc"><b>${esc(r.name)}</b><div class="hint n" style="direction:rtl">${r.moves.slice(-4).map(x=>`${x.d.slice(8)}/${x.d.slice(5,7)}: ${x.db?'+'+fmt(x.db):''}${x.pd?' −'+fmt(x.pd):''}${x.wo?' شطب '+fmt(x.wo):''}`).join(' · ')}</div></td><td class="n">${fmt(r.debt)}</td><td class="n">${fmt(r.paid)}</td><td class="n">${fmt(r.wo)}</td><td class="n"><span class="tag debt">${fmt(r.rem)}</span></td><td class="n">${r.last}</td><td><button class="btn sm" data-pay="${i}" type="button">تحصيل</button> <button class="btn sm" data-wo="${i}" type="button">شطب</button></td></tr>`).join('')}</tbody></table></div></section>`:'<div class="sheet empty">مفيش ديون مفتوحة.</div>'}
  ${closed.length?`<details><summary>اتسدّدت (${closed.length})</summary><div class="sheet tbl"><table><tbody>${closed.map(r=>`<tr><td>${esc(r.name)}</td><td class="n">${fmt(r.debt)}</td><td>خالص</td><td class="n">${r.last}</td></tr>`).join('')}</tbody></table></div></details>`:''}
  <div class="hint">الدين بيتسجل من خانة <b>باقي</b> في أي حركة مع اسم الاونر. "تحصيل" بيدخل الفلوس الخزنة، و"شطب" بيقفل الدين من غير ما يأثر على الخزنة.</div>`;
  $('#dAll').onchange=e=>{S.debtAll=e.target.checked;render()};
  const nm=r=>r.name==='بدون اسم'?'':r.name;
  document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{const r=open[+b.dataset.pay];openForm(todayISO(),{p:nm(r),d:'تحصيل دين',pd:Math.round(r.rem)},null,true)});
  document.querySelectorAll('[data-wo]').forEach(b=>b.onclick=()=>{const r=open[+b.dataset.wo];openForm(todayISO(),{p:nm(r),d:'شطب دين',wo:Math.round(r.rem)},null,true)});
}

/* ===== SEARCH ===== */
function vSearch(){
  $('#main').innerHTML=`<div class="sec-h"><h2>بحث في الدفتر</h2><span class="line"></span></div>
  <input type="search" id="q" placeholder="اسم دوا أو اونر أو حالة… بيدوّر في المخزن وفي الحركات" value="${esc(S.q)}" style="width:100%;font-size:16px;padding:10px 12px"><div id="qr" style="display:grid;gap:10px"></div>`;
  const run=()=>{const q=S.q.trim(),h=$('#qr');if(q.length<2){h.innerHTML='<div class="hint">اكتب حرفين على الأقل.</div>';return}
    const res=[];for(const [d,es] of idx().days)es.forEach((e,ix)=>{if(((e.d||'')+' '+(e.p||'')).includes(q))res.push({...e,_d:d,_ix:ix})});
    res.reverse();const t=sumEntries(res);
    h.innerHTML=itemsBox(q)+`<div class="daysum"><span>النتايج<b>${res.length}</b></span><span>الداخل<b>${fmt(t.cashIn)}</b></span><span>المكسب<b>${fmt(t.profit)}</b></span><span>باقي<b>${fmt(t.db)}</b></span>${res.length>300?'<span>بيظهر أحدث 300</span>':''}</div>`+(res.length?entryTable(res.slice(0,300),{date:true}):'');bindRows();document.querySelectorAll('tr[data-it]').forEach(tr=>tr.onclick=()=>openItem(S.items[tr.dataset.it]))};
  $('#q').oninput=e=>{S.q=e.target.value;clearTimeout(run.t);run.t=setTimeout(run,200)};run();$('#q').focus();
}

function bindBackup(){document.querySelectorAll('[data-backup]').forEach(b=>b.onclick=async()=>{b.disabled=true;const ok=await exportXlsx(monthList(),'دفتر-العيادة-'+todayISO()+'.xlsx');b.disabled=false;if(ok)markBackup()})}
async function markBackup(){try{await setDoc('config/main',{...S.config,lastBackup:todayISO()});render()}catch(e){}}
async function save(filename,blob){try{const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true}catch(e){toast('التنزيل ما تمّش');return false}}
async function exportXlsx(months,filename){
  if(!window.XLSX){toast('مكتبة الإكسل ما اتحمّلتش — جرّب تحدّث الصفحة');return false}
  const keys=[...GROUPS.flatMap(G=>G.f),'so','ks','sg','ch','db','pd','wo','vi','vo','ve','ex','sd'];
  const head=['اليوم','التاريخ','البيان',...GROUPS.flatMap(G=>G.f.map(k=>G.name+' '+LABEL[k])),'سونار','كشف وعلاج','عمليات','صدقة','باقي','تحصيل','شطب','فودافون داخل','فودافون خارج','فودافون مصاريف','مصاريف','دين موردين','الاونر'];
  const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};
  for(const m of months){const es=monthEntries(m);const aoa=[head];let last='';
    for(const e of es){aoa.push([e._d!==last?dayName(e._d):'',e._d!==last?e._d:'',e.d||'',...keys.map(k=>g(e,k)||null),e.p||'']);last=e._d}
    const s=sumEntries(es);aoa.push([],['','','الإجمالي',...keys.map(k=>s[k]||null),'']);
    aoa.push(['','','المكسب الكلي',s.profit],['','','صافي الشهر',s.net]);
    const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:9},{wch:11},{wch:22},...keys.map(()=>({wch:9})),{wch:18}];
    XLSX.utils.book_append_sheet(wb,ws,m)}
  if(!months.length){toast('مفيش بيانات تتنزل');return false}
  const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  return save(filename,new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
}

    const back=editing&&e.it===it.id?(+e.q||0):0;h.textContent=`المتاح: ${(+it.q||0)+back} ${it.u||''} · بيع ${fmt(it.sp)} · شراء ${fmt(it.bp)}`;
    if(!auto)return;if(!$('#f_d').value.trim())$('#f_d').value=it.n;
    if(q>0){$('#f_mi').value=Math.round(q*(+it.sp||0)*100)/100;$('#f_mp').value=Math.round(q*((+it.sp||0)-(+it.bp||0))*100)/100}};
  $('#f_it').addEventListener('change',()=>itFill(true));$('#f_q').addEventListener('input',()=>itFill(true));itFill(false);
  setTimeout(()=>(editing?$('#f_mi'):$('#f_d')).focus(),40);
}
/* ===== ITEMS (الأصناف والمخزن) — كل صنف مستند items/<id> في جدول docs ===== */
const itSt=i=>{const t=todayISO();if(i.exp&&i.exp<t)return'exp';if(i.exp&&i.exp<=addDays(t,60))return'soon';if((+i.q||0)<=(+i.min||0))return'low';return'ok'};
const ST={exp:['منتهي','out'],soon:['قرب ينتهي','gold'],low:['ناقص / خلص','gold'],ok:['','']};
async function setItem(it){const {error}=await sb.from('docs').upsert({path:'items/'+it.id,data:it,updated_at:new Date().toISOString()});if(error)throw error;S.items[it.id]=it;lists()}
async function adjustStock(o,n){const d={};const add=(id,v)=>{if(id)d[id]=(d[id]||0)+v};if(o&&o.it)add(o.it,+o.q||0);if(n&&n.it)add(n.it,-(+n.q||0));
  try{for(const [id,v] of Object.entries(d)){const it=S.items[id];if(!it||!v)continue;await setItem({...it,q:Math.round(((+it.q||0)+v)*1000)/1000})}}catch(x){toast('الحركة اتسجلت بس الكمية في المخزن ما اتحدّثتش')}}
function itemsBox(q){const L=Object.values(S.items).filter(i=>((i.n||'')+' '+(i.sup||'')).includes(q)).slice(0,30);if(!L.length)return'';
  return `<section class="sheet tbl"><table><thead><tr><th>صنف في المخزن</th><th class="n">الكمية</th><th class="n">سعر البيع</th><th class="n">الصلاحية</th></tr></thead><tbody>${L.map(i=>`<tr class="click" data-it="${esc(i.id)}"><td>${esc(i.n)}</td><td class="n">${+i.q||0} ${esc(i.u||'')}</td><td class="n">${fmt(i.sp)}</td><td class="n">${esc(i.exp||'—')}</td></tr>`).join('')}</tbody></table></section>`}
function vItems(){
  const q=(S.iq||'').trim(),f=S.fl||'all';let L=Object.values(S.items);const total=L.length;
  const cnt={exp:0,soon:0,low:0},val=L.reduce((a,i)=>a+(+i.q||0)*(+i.bp||0),0);L.forEach(i=>{const s=itSt(i);if(cnt[s]!==undefined)cnt[s]++});
  L=L.filter(i=>(!q||((i.n||'')+' '+(i.sup||'')).includes(q))&&(f==='all'||itSt(i)===f)).sort((a,b)=>(a.n||'').localeCompare(b.n||'','ar'));
  $('#main').innerHTML=`<div class="sec-h"><h2>الأصناف والمخزن</h2><span class="line"></span><div class="tools"><button class="btn pri sm" id="iN" type="button">+ صنف جديد</button><button class="btn sm" id="iI" type="button">استيراد من Excel</button><button class="btn sm" id="iX" type="button">تنزيل Excel</button><input type="file" id="iF" accept=".xlsx,.xls,.csv" hidden></div></div>
  <div class="strip"><div class="hero"><span class="k">عدد الأصناف</span><span class="v n">${total}</span><span class="d">قيمة المخزون بسعر الشراء: ${fmt(val)}</span></div><div><span class="k">ناقص / خلص</span><span class="v n gold">${cnt.low}</span></div><div><span class="k">قرب الصلاحية (60 يوم)</span><span class="v n gold">${cnt.soon}</span></div><div><span class="k">منتهي الصلاحية</span><span class="v n out">${cnt.exp}</span></div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><input type="search" id="iQ" placeholder="دوّر باسم الصنف أو المورد" value="${esc(S.iq||'')}" style="flex:1;min-width:200px;font-size:16px;padding:9px 12px"><select id="iS">${[['all','الكل'],['low','ناقص / خلص'],['soon','قرب الصلاحية'],['exp','منتهي']].map(([k,l])=>`<option value="${k}" ${k===f?'selected':''}>${l}</option>`).join('')}</select></div>
  ${L.length?`<section class="sheet tbl"><table><thead><tr><th>الصنف</th><th>الوحدة</th><th class="n">شراء</th><th class="n">بيع</th><th class="n">الكمية</th><th>الصلاحية</th><th>المورد</th><th></th></tr></thead><tbody>${L.slice(0,500).map(i=>{const s=ST[itSt(i)];return `<tr class="click" data-it="${esc(i.id)}"><td class="desc"><b>${esc(i.n)}</b></td><td>${esc(i.u||'')}</td><td class="n">${fmt(i.bp)}</td><td class="n">${fmt(i.sp)}</td><td class="n">${+i.q||0}</td><td class="n">${esc(i.exp||'—')}</td><td>${esc(i.sup||'')}</td><td>${s[0]?`<span class="tag ${s[1]==='out'?'':'debt'}" style="${s[1]==='out'?'color:var(--out)':''}">${s[0]}</span>`:''}</td></tr>`}).join('')}</tbody></table></section>`:`<div class="sheet empty">${total?'مفيش نتايج.':'لسه مفيش أصناف. دوس "+ صنف جديد" أو "استيراد من Excel" وضيف الأدوية.'}</div>`}
  <div class="hint">${L.length>500?'بيظهر أول 500 صنف، استخدم البحث. ':''}دوس على أي صنف لتعديله. لما تبيع صنف من <b>+ تسجيل حركة</b> (خانة "بيع صنف من المخزن") الكمية بتنقص لوحدها. ملف الاستيراد لازم يكون بنفس أعمدة ملف "تنزيل Excel"، ولو اسم الصنف موجود بيتحدّث.</div>`;
  $('#iN').onclick=()=>openItem();
  document.querySelectorAll('tr[data-it]').forEach(tr=>tr.onclick=()=>openItem(S.items[tr.dataset.it]));
  $('#iS').onchange=e=>{S.fl=e.target.value;vItems()};
  $('#iQ').oninput=e=>{S.iq=e.target.value;clearTimeout(vItems.t);vItems.t=setTimeout(()=>{vItems();const el=$('#iQ');el.focus();el.setSelectionRange(el.value.length,el.value.length)},200)};
  $('#iX').onclick=exportItems;$('#iI').onclick=()=>$('#iF').click();
  $('#iF').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{toast('بيستورد…');const n=await importItems(f);toast('اتستورد '+n+' صنف');vItems()}catch(x){toast('الاستيراد فشل: '+(x.message||x))}};
}
function exportItems(){if(!window.XLSX){toast('مكتبة الإكسل ما اتحمّلتش');return}
  const L=Object.values(S.items).sort((a,b)=>(a.n||'').localeCompare(b.n||'','ar'));
  const aoa=[['الصنف','الوحدة','سعر الشراء','سعر البيع','الكمية','حد الطلب','الصلاحية','المورد'],...L.map(i=>[i.n,i.u||'',+i.bp||0,+i.sp||0,+i.q||0,+i.min||0,i.exp||'',i.sup||''])];
  const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:28},{wch:10},{wch:11},{wch:11},{wch:9},{wch:9},{wch:12},{wch:18}];XLSX.utils.book_append_sheet(wb,ws,'الأصناف');
  save('المخزن-'+todayISO()+'.xlsx',new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}))}
async function importItems(file){
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
  const byName={};Object.values(S.items).forEach(i=>byName[i.n]=i);const out=[];
  for(const r of rows){const name=String(r['الصنف']||'').trim();if(!name)continue;const old=byName[name];let ex=r['الصلاحية'];
    ex=ex instanceof Date?new Date(ex.getTime()+12*36e5).toISOString().slice(0,10):String(ex||'').slice(0,10);
    out.push({id:old?old.id:uid(),n:name,u:String(r['الوحدة']||''),bp:+r['سعر الشراء']||0,sp:+r['سعر البيع']||0,q:+r['الكمية']||0,min:+r['حد الطلب']||0,exp:/^\d{4}-\d{2}-\d{2}$/.test(ex)?ex:'',sup:String(r['المورد']||'')});byName[name]=out[out.length-1]}
  for(let j=0;j<out.length;j+=50){const rr=out.slice(j,j+50).map(x=>({path:'items/'+x.id,data:x,updated_at:new Date().toISOString()}));const {error}=await sb.from('docs').upsert(rr);if(error)throw error;rr.forEach(x=>S.items[x.data.id]=x.data)}
  lists();return out.length}
function openItem(it){const ed=!!it;it=it||{};const nm=(k,l,v)=>`<div class="f"><label for="i_${k}">${l}</label><input type="number" inputmode="decimal" step="any" min="0" id="i_${k}" value="${v||v===0?v:''}"></div>`;
  $('#ovHost').innerHTML=`<div class="ov" id="ov"><form class="form" id="itf" novalidate>
  <div style="display:flex;align-items:center;gap:10px"><h2 style="flex:1">${ed?'تعديل صنف':'صنف جديد'}</h2><button class="btn sm" type="button" id="iC">إغلاق</button></div>
  <div class="fg"><div class="f" style="grid-column:span 2"><label for="i_n">اسم الصنف</label><input type="text" id="i_n" value="${esc(it.n||'')}" autocomplete="off"></div>
    <div class="f"><label for="i_u">الوحدة</label><input type="text" id="i_u" list="dlUnit" value="${esc(it.u||'')}" placeholder="علبة / أمبول"><datalist id="dlUnit"><option value="علبة"><option value="أمبول"><option value="زجاجة"><option value="شريط"><option value="كيس"><option value="كيلو"><option value="جرعة"></datalist></div></div>
  <div class="fg">${nm('bp','سعر الشراء',it.bp)}${nm('sp','سعر البيع',it.sp)}${nm('q','الكمية الحالية',it.q)}${nm('min','حد الطلب (ينبّه لو الكمية وصلت له)',it.min)}</div>
  <div class="fg"><div class="f"><label for="i_exp">تاريخ الصلاحية</label><input type="date" id="i_exp" value="${esc(it.exp||'')}"></div><div class="f" style="grid-column:span 2"><label for="i_sup">المورد</label><input type="text" id="i_sup" list="dlParty" value="${esc(it.sup||'')}" autocomplete="off"></div></div>
  <div class="err" id="iErr" hidden></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" type="submit">حفظ</button><span style="flex:1"></span>${ed?'<button class="btn danger" type="button" id="iD">مسح الصنف</button>':''}</div></form></div>`;
  const close=()=>{$('#ovHost').innerHTML=''};$('#iC').onclick=close;$('#ov').onclick=ev=>{if(ev.target.id==='ov')close()};
  $('#itf').onsubmit=async ev=>{ev.preventDefault();const er=$('#iErr');er.hidden=true;const n=$('#i_n').value.trim();
    if(!n){er.textContent='اكتب اسم الصنف.';er.hidden=false;return}
    if(Object.values(S.items).some(x=>x.n===n&&x.id!==it.id)){er.textContent='الاسم ده موجود قبل كده في المخزن.';er.hidden=false;return}
    const o={id:it.id||uid(),n,u:$('#i_u').value.trim(),bp:+$('#i_bp').value||0,sp:+$('#i_sp').value||0,q:+$('#i_q').value||0,min:+$('#i_min').value||0,exp:$('#i_exp').value||'',sup:$('#i_sup').value.trim()};
    try{await setItem(o);toast('اتحفظ');close();render()}catch(x){er.textContent='مقدرتش أحفظ: '+(x.message||x);er.hidden=false}};
  if(ed)$('#iD').onclick=async function(){if(!this.dataset.c){this.dataset.c=1;this.textContent='اضغط تاني للتأكيد';return}
    try{const r=await sb.from('docs').delete().eq('path','items/'+it.id);if(r.error)throw r.error;delete S.items[it.id];lists();toast('اتمسح');close();render()}catch(x){toast('مقدرتش أمسح')}};
  setTimeout(()=>$('#i_n').focus(),40)}

$('#fab').onclick=()=>openForm(route()==='day'&&S.day?S.day:todayISO());
render();boot();
</script>
